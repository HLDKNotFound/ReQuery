training:
  output_dir: "experiments/qlora_qwen"  # Base output directory for checkpoints, metrics, and adapters
  epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  save_total_limit: 3
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  auto_resume: true  # Automatically resume from latest checkpoint when epochs are increased
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  seed: 42
  max_grad_norm: 1.0

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
